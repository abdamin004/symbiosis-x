<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mission control · SYMBIOSIS X</title>
<style>
:root{color-scheme:dark;--ink:#f0f0ff;--muted:#a8a9c4;--light:#b8baff;--dark:#070812;font:16px/1.55 system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);background:
  radial-gradient(ellipse at 87% 9%,#25204a80,transparent 45%),
  radial-gradient(ellipse at 16% 88%,#12274d80,transparent 50%),var(--dark)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;
  background-image:radial-gradient(circle,#c7c6ff8a 1px,transparent 1.4px),radial-gradient(circle,#a2b8ff88 .8px,transparent 1.2px);
  background-size:117px 89px,173px 137px;background-position:34px 16px,82px 58px}
body{isolation:isolate}
main{width:min(1060px,calc(100% - 48px));margin:0 auto;padding:clamp(2rem,8vh,6rem) 0 4rem}
h1,h2,p{margin:0}
h1{font-size:clamp(3rem,7vw,5.4rem);font-weight:650;line-height:.94;letter-spacing:-.075em}
h2{font-size:clamp(1.8rem,5vw,3.2rem);font-weight:550;line-height:1.08;letter-spacing:-.045em}
.muted{color:var(--muted)}
.brand{color:var(--light);font-size:.8rem;letter-spacing:.16em;margin-bottom:.7rem}
header{display:grid;grid-template-columns:1fr auto;gap:1.6rem;align-items:end}
.clock{font-variant-numeric:tabular-nums;font-size:clamp(2.2rem,5vw,4rem);line-height:1}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:.65rem;margin:1.5rem 0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:transparent}
button:disabled{opacity:.48;cursor:default}
button:focus-visible{outline:2px solid var(--light);outline-offset:4px}
.command{border-radius:999px;padding:.55rem 1rem;background:#252545;color:#f1efff}
.command.primary{background:#bebaff;color:#14102a;font-weight:650}
#run-status{font-size:.94rem}
[hidden]{display:none!important}
.run-data{padding:1.1rem 0 1.3rem;border-block:1px solid #a3a0ff2b}
.view-controls{display:flex;align-items:center;gap:.65rem;flex-wrap:wrap}
.view-controls button{padding:.28rem .55rem;border-radius:7px;color:var(--muted)}
.view-controls button[aria-pressed=true]{background:#9d93ff22;color:var(--ink)}
#refresh-view{margin-inline-start:auto}
#projection-value{margin:.75rem 0 .15rem;color:#c9dfff;font-size:clamp(1.45rem,4vw,2.35rem);font-variant-numeric:tabular-nums}
#projection-evidence{color:var(--muted);font-size:.93rem}
#run-key{overflow-wrap:anywhere;font: .83rem ui-monospace,monospace;color:var(--muted);margin-top:.65rem}
a{color:var(--light);text-underline-offset:.2em}
.tabs,.rooms,.replay-controls{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center}
.tabs{margin:1.25rem 0 .8rem}
.tabs button,.rooms button,.replay-controls button{padding:.4rem .68rem;border-radius:7px;color:var(--muted)}
button[aria-pressed=true]{color:var(--ink);background:#9d93ff22}
.workspace{margin-top:2rem}
.workspace h2{font-size:1.65rem}
#replay-panel{margin:1rem 0 1.5rem;padding:1rem 0;border-block:1px solid #a3a0ff2b}
.replay-controls input{flex:1;min-width:120px;accent-color:var(--light)}
#replay-caption{margin:.6rem 0;color:#c9dfff}
#replay-crew{margin-top:.65rem;display:flex;flex-wrap:wrap;gap:.4rem 1rem;color:var(--muted)}
#replay-crew input{accent-color:var(--light)}
.rooms{margin:1rem 0}
.systems{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:1.05rem 1.6rem}
.system{padding:.8rem 0 .3rem;border-top:1px solid #a3a0ff38}
.system h3{font-size:.95rem;font-weight:550;margin:0;color:var(--ink)}
.system .value{font-size:clamp(1.15rem,3vw,1.65rem);color:#c9dfff;margin:.28rem 0;font-variant-numeric:tabular-nums}
.system .evidence,.system .insight{font-size:.85rem;color:var(--muted)}
.system .evidence{color:var(--light);margin-bottom:.28rem}
.workspace ul{list-style:none;padding:0;margin:1rem 0}
.workspace li{padding:.34rem 0}
@media(max-width:600px){main{width:calc(100% - 32px)}header{grid-template-columns:1fr}.workspace{margin-top:1.5rem}}
</style>
</head>
<body>
<main>
  <header>
    <div><p class="brand">SYMBIOSIS X</p><h1>Mission control</h1><p><a href="/flight">Open flight view</a></p></div>
    <div><p class="muted">Mission time</p><p class="clock" id="clock">00:00</p></div>
  </header>
  <div class="actions">
    <button id="start" class="command primary" type="button">Start nominal run</button>
    <button id="advance" class="command" type="button" disabled>Advance to 01:00</button>
    <p id="run-status" class="muted" role="status">Ready to start a simulated run.</p>
  </div>
  <section class="run-data" id="run-data" aria-label="Run viewpoints" hidden>
    <div class="view-controls" role="group" aria-label="Viewpoint">
      <button id="crew-view" type="button" aria-pressed="true">Crew</button>
      <button id="ground-view" type="button" aria-pressed="false">Ground</button>
      <button id="refresh-view" type="button">Refresh view</button>
    </div>
    <div aria-live="polite">
      <p id="projection-value"></p>
      <p id="projection-evidence"></p>
    </div>
    <p id="run-key"></p>
  </section>
  <section class="workspace" aria-label="Digital twin screens">
    <nav class="tabs" id="screens" aria-label="Main screens">
      <button type="button" data-screen="launcher">Run Launcher</button>
      <button type="button" data-screen="crew">Crew Health</button>
      <button type="button" data-screen="measure">Take Measurement</button>
      <button type="button" data-screen="emergency">Emergency Assist</button>
      <button type="button" data-screen="ground">Ground</button>
    </nav>
    <section id="screen-content" aria-labelledby="screen-title">
      <h2 id="screen-title"></h2>
      <p class="muted" id="screen-note"></p>
      <ul id="screen-items"></ul>
    </section>
    <section id="replay-panel" aria-labelledby="replay-title">
      <h2 id="replay-title">Travel replay</h2>
      <div class="replay-controls">
        <button type="button" id="play-replay">Play travel replay</button>
        <button type="button" id="next-checkpoint">Next checkpoint</button>
        <button type="button" id="reset-replay">Reset replay</button>
        <button type="button" id="live-systems" hidden>Show live readings</button>
        <input id="checkpoint" type="range" min="0" value="0" aria-label="Travel checkpoint">
      </div>
      <p id="replay-caption"></p>
      <p class="muted">Cabin values come from the Python model. Scrubber faults and power changes follow the replay scenario.</p>
      <div id="replay-crew" role="group" aria-label="Confirm reduced activity at 06:00"></div>
    </section>
    <section aria-labelledby="systems-title">
      <h2 id="systems-title">Ship systems</h2>
      <nav class="rooms" id="rooms" aria-label="Filter by spacecraft room"></nav>
      <p id="room-function" class="muted"></p>
      <div id="systems" class="systems"></div>
    </section>
  </section>
</main>
<script type="application/json" id="room-catalog">__ROOM_CATALOG__</script>
<script>
const byId = id => document.getElementById(id);
const catalog = JSON.parse(byId("room-catalog").textContent);
const rooms = catalog.rooms;
let liveView = null;
let selectedRoom = null;
let frameIndex = 0;
let replayMode = false;
let timer = null;
const reducedCrew = new Set();
const runStorageKey = "symbiosis-x:nominal-run";
let run = null;
try {
  const saved = JSON.parse(sessionStorage.getItem(runStorageKey));
  if (saved?.run_id && Number.isInteger(saved.step)) run = saved;
} catch {}
let viewpoint = "crew";
let readVersion = 0;
let startId = null;
let advanceId = null;
let working = false;

const screens = {
  launcher: ["Run Launcher", "Start or advance a live nominal run. Use the travel replay to inspect the scripted fault sequence."],
  crew: ["Crew Health", "The live Crew view shows the accepted cabin sample. Crew activity controls below affect the synthetic replay."],
  measure: ["Take Measurement", "Seven measurement types are registered. Saving readings is planned."],
  emergency: ["Emergency Assist", "Onboard training drills and acknowledgment are planned."],
  ground: ["Ground", "The live Ground view shows only delivered evidence from this run."],
};

function selectScreen(key) {
  const [title, note] = screens[key];
  byId("screen-title").textContent = title;
  byId("screen-note").textContent = note;
  byId("screen-items").replaceChildren();
  byId("screen-items").hidden = key !== "measure";
  if (key === "measure") {
    for (const metric of catalog.metrics) {
      const item = document.createElement("li");
      const inputs = metric.required_values ?? metric.required_fields
        ?? metric.accepted_forms?.map(form => form.join(" + "));
      const details = [metric.unit, inputs?.join(" or "), metric.required_context?.join(", ")]
        .filter(Boolean).join(" · ");
      item.textContent = metric.label + (details ? " · " + details : "");
      byId("screen-items").append(item);
    }
  }
  document.querySelectorAll("[data-screen]").forEach(button => {
    button.setAttribute("aria-pressed", button.dataset.screen === key);
  });
  if (key === "crew" || key === "ground") {
    viewpoint = key;
    stopReplay();
    replayMode = false;
    readView();
  }
}

function systemReading(system, frame) {
  const replayCo2 = frame.co2.toFixed(2) + " ppm";
  const launchPacket = catalog.ground;
  const packet = liveView?.packet;
  const readings = {
    clock: [run ? formatTime(run.mission_s) : "Ready to start", "Live run"],
    navigation: [frame.phase + " · " + frame.site, "Scripted phase · ETA planned"],
    air: [replayCo2, "Replay · " + formatTime(frame.time)],
    activity: [frame.generation == null ? "Unmodeled" : frame.generation.toFixed(3) + " m³/h CO₂", "Replay · Four astronauts"],
    co2: [replayCo2, "Replay · " + catalog.sensor.source_id],
    scrubber: [frame.removal == null ? "Unmodeled" : frame.removal.toFixed(0) + " m³/h", frame.removal == null ? "Station · Unmodeled" : frame.removal < 20 ? "Replay · Degraded" : "Replay · Nominal"],
    power: [frame.power == null ? "Unmodeled" : frame.power.toFixed(2) + " kW", frame.power == null ? "Station · Unmodeled" : frame.power < 0.40 ? "Replay · Low headroom" : "Replay · Nominal"],
    habitat: [frame.habitat.beds + "/4 beds · WC " + frame.habitat.wc, frame.habitat.meal],
    hatch: [frame.dock, "Scripted"],
    health: [catalog.metrics.length + " measurement types", "Catalog ready"],
    relay: [frame.time >= launchPacket.delivery.received_at_s ? "Delivered · " + launchPacket.snapshot_id : "Awaiting replay packet", "Replay · Ground"],
  };
  if (!replayMode && liveView && (system.key === "air" || system.key === "co2")) {
    const observation = viewpoint === "crew" ? liveView.co2 : packet?.co2;
    return observation
      ? [observation.value.toFixed(2) + " ppm", "Live " + viewpoint + " · observed " + formatTime(observation.observed_at_s)]
      : [viewpoint === "ground" ? "Awaiting Ground delivery" : "No cabin sample yet", "Live " + viewpoint];
  }
  if (!replayMode && liveView?.role === "ground" && system.key === "relay") {
    return packet ? ["Delivered · " + formatTime(packet.delivery.received_at_s), "Live Ground · age " + formatTime(packet.delivery.age_s)]
      : ["Awaiting Ground delivery", "Live Ground"];
  }
  return readings[system.key] ?? ["Model pending", "Planned"];
}

function renderReplay() {
  const key = catalog.crew_ids.filter(id => reducedCrew.has(id)).join(",");
  const frame = catalog.replays[key][frameIndex];
  byId("checkpoint").value = frameIndex;
  byId("live-systems").hidden = !replayMode || !run;
  byId("checkpoint").setAttribute("aria-valuetext", formatTime(frame.time) + " " + frame.label);
  byId("replay-caption").textContent = "Replay " + formatTime(frame.time) + " · " + frame.phase + " · " + frame.vehicle + " · " + frame.label + " · Cabin " + frame.co2.toFixed(2) + " ppm";
  byId("play-replay").textContent = timer ? "Pause travel replay" : "Play travel replay";
  byId("next-checkpoint").disabled = frameIndex === catalog.replays[""].length - 1;
  const chosen = selectedRoom ? [selectedRoom] : rooms;
  byId("room-function").textContent = selectedRoom?.function ?? "";
  byId("systems").replaceChildren(...chosen.flatMap(room => room.systems.map(system => {
    const widget = document.createElement("article");
    widget.className = "system";
    if (system.entity_id) widget.dataset.entityId = system.entity_id;
    const [value, evidence] = systemReading(system, frame);
    const heading = document.createElement("h3");
    heading.textContent = system.name;
    const rows = [["value", value], ["evidence", room.name + " · " + evidence], ["insight", system.insight]];
    widget.append(heading, ...rows.map(([kind, text]) => {
      const row = document.createElement("p");
      row.className = kind;
      row.textContent = text;
      return row;
    }));
    return widget;
  })));
}

function stopReplay() {
  clearInterval(timer);
  timer = null;
}

function nextCheckpoint() {
  replayMode = true;
  const last = catalog.replays[""].length - 1;
  frameIndex = Math.min(frameIndex + 1, last);
  if (frameIndex === last) stopReplay();
  renderReplay();
}

for (const room of [null, ...rooms]) {
  const button = document.createElement("button");
  button.type = "button";
  button.textContent = room?.name ?? "All rooms";
  button.setAttribute("aria-pressed", room === null);
  button.addEventListener("click", () => {
    selectedRoom = room;
    byId("rooms").querySelectorAll("button").forEach(item => item.setAttribute("aria-pressed", item === button));
    renderReplay();
  });
  byId("rooms").append(button);
}
for (const id of catalog.crew_ids) {
  const label = document.createElement("label");
  const input = document.createElement("input");
  input.type = "checkbox";
  input.addEventListener("change", () => {
    replayMode = true;
    if (input.checked) reducedCrew.add(id);
    else reducedCrew.delete(id);
    renderReplay();
  });
  label.append(input, " " + id + " reduced activity at 06:00");
  byId("replay-crew").append(label);
}
byId("checkpoint").max = catalog.replays[""].length - 1;
byId("checkpoint").addEventListener("input", event => {
  stopReplay();
  replayMode = true;
  frameIndex = Number(event.target.value);
  renderReplay();
});
byId("next-checkpoint").addEventListener("click", nextCheckpoint);
byId("reset-replay").addEventListener("click", () => {
  stopReplay();
  replayMode = true;
  frameIndex = 0;
  reducedCrew.clear();
  byId("replay-crew").querySelectorAll("input").forEach(input => { input.checked = false; });
  renderReplay();
});
byId("live-systems").addEventListener("click", () => {
  stopReplay();
  replayMode = false;
  readView();
});
byId("play-replay").addEventListener("click", () => {
  if (timer) stopReplay();
  else {
    replayMode = true;
    if (frameIndex === catalog.replays[""].length - 1) frameIndex = 0;
    timer = setInterval(nextCheckpoint, 1800);
  }
  renderReplay();
});
document.querySelectorAll("[data-screen]").forEach(button => {
  button.addEventListener("click", () => selectScreen(button.dataset.screen));
});

let demoTokens = null;

async function getDemoTokens() {
  if (!demoTokens) {
    const response = await fetch("/api/v1/demo/session", {method:"POST", cache:"no-store"});
    if (!response.ok) throw new Error("Local demo session unavailable");
    demoTokens = await response.json();
  }
  return demoTokens;
}

async function requestRun(path, role, payload, retry = true) {
  const tokens = await getDemoTokens();
  const headers = {Authorization:"Bearer " + tokens[role]};
  if (payload) headers["Content-Type"] = "application/json";
  const response = await fetch(path, {
    method:payload ? "POST" : "GET", headers,
    body:payload ? JSON.stringify(payload) : undefined,
    cache:"no-store",
  });
  if (response.status === 401 && retry) {
    demoTokens = null;
    return requestRun(path, role, payload, false);
  }
  if (!response.ok) {
    const error = await response.json();
    const failure = new Error(typeof error.detail === "string" ? error.detail : "Request rejected");
    failure.status = response.status;
    throw failure;
  }
  return response.json();
}

const formatTime = seconds => {
  const sign = seconds < 0 ? "−" : "";
  const time = Math.abs(seconds);
  return sign + [Math.floor(time / 60), time % 60].map(value => String(value).padStart(2, "0")).join(":");
};

async function readView() {
  if (!run) return;
  liveView = null;
  renderReplay();
  const version = ++readVersion;
  const activeRun = run.run_id;
  const role = viewpoint;
  byId("crew-view").setAttribute("aria-pressed", role === "crew");
  byId("ground-view").setAttribute("aria-pressed", role === "ground");
  byId("projection-value").textContent = "Loading view…";
  byId("projection-evidence").textContent = "";
  try {
    const view = await requestRun("/api/v1/runs/" + encodeURIComponent(activeRun) + "/" + role, role);
    if (version !== readVersion || view.run_id !== activeRun) return;
    liveView = view;
    renderReplay();
    byId("clock").textContent = formatTime(view.mission_s);
    const packet = role === "ground" ? view.packet : null;
    const reading = role === "crew" ? view.co2 : packet?.co2;
    byId("projection-value").textContent = reading
      ? reading.value.toFixed(2) + " " + reading.unit + " cabin CO₂"
      : (role === "ground" ? "Awaiting Ground delivery" : "No cabin sample yet");
    byId("projection-evidence").textContent = packet
      ? "Observed " + formatTime(packet.delivery.observed_at_s)
        + " · delivered " + formatTime(packet.delivery.received_at_s)
        + " · age " + formatTime(packet.delivery.age_s)
      : (reading ? "Observed " + formatTime(reading.observed_at_s) + " · " + reading.source_id : "");
    // Synchronize the nominal cursor if another operator advanced this run.
    if (view.mission_s === 60 && run.step === 0) {
      run = {...run, mission_s:60, step:1};
      saveRun();
      showRun();
    }
    updateControls();
  } catch (error) {
    if (version !== readVersion) return;
    if (error.status === 404) {
      run = null;
      startId = null;
      advanceId = null;
      saveRun();
      byId("run-data").hidden = true;
      byId("clock").textContent = "00:00";
      byId("run-status").textContent = "Run unavailable. Start a new nominal run.";
      updateControls();
      return;
    }
    byId("projection-value").textContent = "View unavailable";
    byId("projection-evidence").textContent = error.message + " · Use Refresh view to retry.";
  }
}

function saveRun() {
  try { sessionStorage.setItem(runStorageKey, JSON.stringify(run)); } catch {}
}

function showRun() {
  byId("clock").textContent = formatTime(run.mission_s);
  byId("run-status").textContent = run.step ? "Step saved" : "Nominal run · Seed " + run.seed;
  byId("run-data").hidden = false;
  byId("run-key").textContent = "Run " + run.run_id;
}

function updateControls() {
  byId("start").disabled = working || (run !== null && run.step < 1);
  byId("start").textContent = run?.step ? "Start another run" : "Start nominal run";
  byId("advance").disabled = working || run === null || run.step >= 1;
}

async function execute(command) {
  working = true;
  updateControls();
  try {
    run = await command();
    stopReplay();
    replayMode = false;
    saveRun();
    showRun();
    await readView();
  } catch (error) {
    byId("run-status").textContent = "Request failed. Retry to reuse the same operation. " + error.message;
  } finally {
    working = false;
    updateControls();
  }
}

byId("start").addEventListener("click", () => {
  startId ??= crypto.randomUUID();
  execute(() => requestRun("/api/v1/runs", "facilitator", {
    start_id:startId, scenario_id:"nominal", scenario_version:"1", seed:4242,
  }).then(receipt => {
    startId = null;
    advanceId = null;
    return receipt;
  }));
});
byId("advance").addEventListener("click", () => {
  advanceId ??= crypto.randomUUID();
  execute(() => requestRun("/api/v1/runs/" + encodeURIComponent(run.run_id) + "/advance", "facilitator", {
    advance_id:advanceId, expected_step:run.step,
  }));
});
for (const role of ["crew", "ground"]) {
  byId(role + "-view").addEventListener("click", () => {
    viewpoint = role;
    stopReplay();
    replayMode = false;
    readView();
  });
}
byId("refresh-view").addEventListener("click", readView);
selectScreen("launcher");
renderReplay();
if (run) {
  showRun();
  updateControls();
  readView();
}
</script>
</body>
</html>
