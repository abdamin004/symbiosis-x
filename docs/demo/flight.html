<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flight · SYMBIOSIS X</title>
<style>
:root{color-scheme:dark;--bg:#060810;--ink:#eef0ff;--muted:#aeb8d3;--blue:#9bdcff;--violet:#bdabff;--edge:#9d9fff33;font:16px/1.45 system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}
main{min-height:100dvh;position:relative}
h1,h2,p{margin:0}a{color:var(--blue);text-underline-offset:.2em}
.stage{position:relative;isolation:isolate;min-height:100dvh;background:radial-gradient(ellipse at 64% 45%,#251944 0%,#0a0e20 53%,#05070f 82%);overflow:clip}
.stage::before,.stage::after{content:"";position:absolute;pointer-events:none;z-index:-1}
.stage::before{inset:-70px;background-image:radial-gradient(circle,#e5e2ffb8 1px,transparent 1.5px),radial-gradient(circle,#b9d7fba8 .8px,transparent 1.2px);background-size:97px 83px,149px 127px;background-position:11px 21px,63px 55px;opacity:.7}
.stage[data-playing=true]::before{animation:travel 9s linear infinite}
.stage::after{width:min(65vw,640px);aspect-ratio:1;border-radius:50%;right:-16%;top:48%;background:radial-gradient(circle at 25% 8%,#595989 0,#303451 23%,#111427 54%,#080a16 72%);box-shadow:-7px -10px 45px #736aff35;opacity:.7}
@keyframes travel{to{transform:translateX(-97px)}}
.viewport{overflow-x:auto;overscroll-behavior-x:contain;position:relative;margin:0 auto;max-width:1500px;padding-top:clamp(1rem,7vh,5rem)}
.ship{width:100%;min-width:680px;aspect-ratio:1100/475;position:relative;isolation:isolate}
#hull{position:absolute;width:100%;height:100%;inset:0;pointer-events:none;z-index:-1}
button{font:inherit;color:inherit;cursor:pointer;background:#171d38;border:0;border-radius:8px;padding:.4rem .7rem}
button:hover{background:#292852}button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
button:disabled{opacity:.46;cursor:default}
button[aria-pressed=true]{background:#3d315e}
.zone,.pawn{position:absolute;transform:translate(-50%,-50%)}
.zone{display:flex;align-items:flex-start;justify-content:center;border-radius:0;background:transparent;text-shadow:0 1px 8px #070711;font-size:clamp(.68rem,1.15vw,.88rem);padding:.56rem .1rem 0;white-space:nowrap;color:#e1e6ff}
.zone:hover,.zone[aria-pressed=true]{background:#b7c4ff13;box-shadow:inset 0 0 0 1px #b9c8ff4b}
.zone[data-alert=true]{color:#ffd198;text-shadow:0 0 12px #ffa45f}
.pawn{--suit:#a9c7ff;width:38px;height:38px;padding:0;display:grid;place-items:center;border:1px solid color-mix(in srgb,var(--suit),transparent 45%);border-radius:50%;background:#141a31;z-index:2}
.pawn::before{content:"";width:21px;height:19px;border-radius:7px 7px 4px 4px;background:linear-gradient(90deg,transparent 3px,var(--suit) 3px 18px,transparent 18px);box-shadow:inset 0 -4px #121a2d9e;transform:translateY(3px)}
.pawn::after{content:"";position:absolute;width:14px;height:11px;top:6px;border:2px solid var(--suit);border-radius:50%;background:#1c2848}
.pawn[aria-pressed=true]{outline:2px solid var(--suit);outline-offset:3px}
.pawn span{position:absolute;top:100%;font:600 .62rem ui-monospace,monospace;color:#fff;background:#111629;padding:.13rem .25rem;border-radius:3px;white-space:nowrap}
.control-deck{position:relative;display:flex;align-items:center;flex-wrap:wrap;gap:.5rem;padding:.65rem 1rem;background:#070b17e8}
.control-deck input{flex:1;min-width:8rem;accent-color:var(--violet)}
#play{background:#bcafff;color:#15102a;font-weight:700}#play:hover{background:#dbd2ff}
.clock{font:700 .9rem ui-monospace,monospace;color:var(--blue)}
.overlays{position:absolute;inset:0;pointer-events:none;overflow:clip;z-index:4}
.panel{position:absolute;width:min(340px,calc(100% - 20px));max-height:min(60vh,520px);overflow:auto;pointer-events:auto;background:#090e22e8;border-radius:12px;padding:.8rem 1rem;box-shadow:0 12px 38px #0007}
.panel h2{font-size:1.08rem}.panel p{color:var(--muted);margin:.35rem 0;font-size:.9rem}.panel .reading{color:var(--blue);font-weight:650}
.widget-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:.4rem}
.move-widget{cursor:grab;touch-action:none;background:transparent;color:var(--muted);padding:.15rem .35rem;font-size:.8rem}
.move-widget:active{cursor:grabbing}
.roster{display:flex;flex-wrap:wrap;gap:.45rem;margin:.65rem 0}
.roster button{font-size:.8rem}
.hud{position:relative;z-index:10;background:linear-gradient(100deg,#111632,#080b18);box-shadow:0 12px 45px #0006}
.ribbon{display:flex;align-items:center;gap:.45rem 1.05rem;flex-wrap:wrap;padding:.55rem 1rem;font-size:.8rem}
.ribbon .resource,.ribbon button{display:inline-flex;align-items:center;gap:.35rem}
.ribbon a{margin-left:auto}
.icon{width:1rem;height:1rem;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.16em}
.ribbon .resource{color:var(--violet)}
.widget-bar h2{margin:0;font-size:1rem;flex:1;pointer-events:none}
.widget-bar .move-widget{padding:.12rem .22rem}
.widget-bar{gap:.28rem}
.widget-title{display:flex;align-items:center;gap:.35rem;text-align:left;color:var(--ink)}
.widget-close{padding:.17rem .4rem;background:transparent;color:var(--muted)}
.crew-strip{position:absolute;top:calc(100% + .35rem);left:.65rem;display:flex;gap:.32rem}
.crew-portrait{width:clamp(42px,7vw,57px);padding:.28rem .2rem;background:#10152bdf;display:grid;justify-items:center;gap:.12rem;color:var(--suit)}
.crew-portrait .icon{width:1.25rem;height:1.25rem}
.crew-portrait small{font:600 .6rem ui-monospace,monospace;color:var(--ink)}
.crew-portrait[data-working=true]{box-shadow:inset 0 -2px #ffcb9c}
.crew-portrait[aria-pressed=true]{box-shadow:inset 0 -2px var(--suit)}
.overview-time{display:flex;align-items:center;justify-content:space-between;gap:.35rem}
#timeline{width:100%;accent-color:var(--violet)}
#map-widget #reset{background:#682c42;color:#ffe1e9;padding:.2rem .45rem}
#map-widget #reset:hover{background:#8c3854}
.play-area{position:relative;min-height:max(520px,calc(100dvh - 145px))}
.profile-window{max-height:min(58vh,480px)}
.asset-target{position:absolute;transform:translate(-50%,-50%);display:grid;place-items:center;padding:0;color:#c8d8ff;background:transparent;border-radius:3px;z-index:1}
.asset-target .icon{background:#10182fdd;border-radius:3px;padding:2px;box-sizing:content-box}
.asset-target:hover,.asset-target[aria-pressed=true]{background:#a5b6ff24;box-shadow:inset 0 0 0 1px #a7beffad}
.asset-target .icon{width:.85rem;height:.85rem}
.ribbon output{color:var(--blue)}
.flight-controls{position:absolute;right:.6rem;top:calc(100% + .35rem);width:max-content;pointer-events:none}
.flight-controls .control-deck{pointer-events:auto;gap:.3rem .44rem;padding:.4rem .55rem;background:#0b1026aa;backdrop-filter:blur(9px);border-radius:10px}
.control-deck button{padding:.25rem .45rem;font-size:.8rem}
.transport{display:flex;align-items:center;gap:.3rem}
#phase{font-size:.75rem}
.overlays{top:var(--control-clearance,100px)}
.asset-target[data-work="active"]{color:#ffd49d;background:#b47c3d36;box-shadow:inset 0 0 0 1px #ffc886b5}
.asset-target[data-work="complete"]{color:#abecd9}
#asset-controls{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center}
#asset-controls select{max-width:100%}
#work-progress{display:block;width:100%;height:.4rem;margin:.55rem 0;accent-color:#c1aaff}
.asset-target{min-width:23px;min-height:23px}
.pawn[data-working=true]{box-shadow:0 0 14px #ffca9c99}
.widget-bar h2{overflow-wrap:anywhere}


.widget-bar h2 .icon{margin-inline-end:.4rem;color:var(--violet)}
.viewport{padding-top:clamp(2rem,9vh,6rem)}
#map-widget{width:min(280px,calc(100% - 20px))}#workflow-widget{width:320px}.route-map{width:100%;display:block}.route-map circle{fill:#b0bdfa}.route-map #ship-position{fill:#e8ccff;stroke:#fbf4ff}

.control-deck a{margin-left:auto;font-size:.85rem}
#phase{color:var(--muted);font-size:.78rem}
#profile-tabs{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:.65rem}
#profile-tabs button{font-size:.76rem}
.profile-data{margin:.55rem 0;display:grid;grid-template-columns:1fr auto;gap:.24rem .6rem;font-size:.82rem;color:var(--muted)}
.profile-data dd{margin:0;color:var(--ink);text-align:right}
#vitals-chart{width:100%;height:auto;background:#10182d;border-radius:5px}
#wellbeing label{display:block;font-size:.8rem;color:var(--muted);margin-top:.3rem}
#wellbeing select{max-width:100%}
[hidden]{display:none!important}
@media(max-width:720px){.stage::after{width:70vw}}
@media(max-width:335px){.flight-controls{top:calc(100% + 3.15rem)}.crew-strip{gap:.22rem}}
@media(prefers-reduced-motion:reduce){.pawn{transition:none}.stage[data-playing=true]::before{animation:none}}
</style>
</head>
<body>
__HUD_ICONS__
<main>
<section class="stage" id="stage" aria-label="Spacecraft in flight">
  <div class="hud"><div class="ribbon" aria-label="Mission resources">
    <span class="resource"><svg class="icon" aria-hidden="true"><use href="#hud-map"/></svg><output id="resource-phase"></output></span><span class="resource"><svg class="icon" aria-hidden="true"><use href="#hud-wind"/></svg><output id="resource-air"></output></span><span class="resource"><svg class="icon" aria-hidden="true"><use href="#hud-zap"/></svg><output id="resource-power"></output></span><span class="resource"><svg class="icon" aria-hidden="true"><use href="#hud-users"/></svg><output id="resource-crew"></output></span>
    <button type="button" id="show-inspector" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="#hud-activity"/></svg>Inspector</button>
    <button type="button" id="show-crew" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="#hud-users"/></svg>Crew</button>
    <button type="button" id="show-workflow" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="#hud-clipboard-list"/></svg>Orders</button>
    <button type="button" id="show-map" aria-pressed="true"><svg class="icon" aria-hidden="true"><use href="#hud-map"/></svg>Overview</button>
    <a href="/mission">Mission control</a>
  </div>
  <nav class="crew-strip" id="crew-strip" aria-label="Astronaut portraits"></nav>
  <div class="flight-controls"><div class="control-deck" role="group" aria-label="Flight playback">
    <button id="play" type="button" aria-label="Play" title="Play or pause"><svg class="icon" aria-hidden="true"><use id="play-icon" href="#hud-play"/></svg></button>
    <button id="speed-cycle" type="button" aria-label="Cycle speed" title="Cycle 1×, 2×, and 4×">1×</button>
    <button id="step" type="button" aria-label="Skip one mission hour" title="Skip one mission hour"><svg class="icon" aria-hidden="true"><use href="#hud-skip-forward"/></svg></button>
  </div></div></div>
  <div class="play-area">
  <div class="viewport" tabindex="0" aria-label="Scrollable spacecraft cutaway">
    <div class="ship" id="ship">
      <canvas id="hull" width="1100" height="475" aria-hidden="true"></canvas>
    </div>
  </div>
<div class="overlays" id="overlays">
  <section class="panel" id="workflow-widget" hidden aria-labelledby="workflow-title">
    <div class="widget-bar"><button class="move-widget widget-title" type="button" aria-label="Move orders with drag or arrow keys"><svg class="icon" aria-hidden="true"><use href="#hud-grip"/></svg></button><h2 id="workflow-title">Onboard orders</h2><button class="widget-close" type="button" aria-label="Close orders"><svg class="icon" aria-hidden="true"><use href="#hud-x"/></svg></button></div>
    <p id="workflow-state"></p>
    <p id="monitor-state"></p>
    <button id="assign-order" type="button" hidden>Commander · Assign inspection</button>
    <button id="hold-order" type="button" hidden>Commander · Hold</button>
    <button id="complete-order" type="button" hidden>SIM-03 · Report inspection</button>
  </section>
  <section class="panel" id="map-widget" aria-label="Mission overview">
    <div class="widget-bar"><button class="move-widget widget-title" type="button" aria-label="Move route map with drag or arrow keys"><svg class="icon" aria-hidden="true"><use href="#hud-grip"/></svg></button><h2>Mission overview</h2><button class="widget-close" type="button" aria-label="Close route map"><svg class="icon" aria-hidden="true"><use href="#hud-x"/></svg></button></div>
    <svg class="route-map" viewBox="0 0 260 58" aria-hidden="true">
      <path d="M18 35 Q75 -4 130 17 Q190 -4 242 35" stroke="#8385bd" fill="none"/>
      <circle cx="18" cy="35" r="4"/><circle cx="130" cy="17" r="4"/><circle cx="242" cy="35" r="4"/>
      <circle id="ship-position" cx="18" cy="35" r="5"/>
      <g fill="#bac5e7" font-size="10"><text x="3" y="55">Earth</text><text x="122" y="39">ISS</text><text x="218" y="55">Return</text></g>
    </svg>
    <p id="map-location"></p>
    <p id="phase"></p>
    <div class="overview-time">
      <output class="clock" id="clock" for="timeline"></output>
      <button id="next-event" type="button" title="Jump to the next scenario checkpoint">Next event</button>
      <button id="reset" type="button" aria-label="Reset game" title="Reset game"><svg class="icon" aria-hidden="true"><use href="#hud-rotate-ccw"/></svg></button>
    </div>
    <input id="timeline" type="range" min="0" value="0" aria-label="Mission time">
    <button id="one-hour" type="button" aria-pressed="false" title="Scale the entire mission to one hour of playback">1-hour pacing</button>
  </section>
  <section class="panel" id="inspector-widget" hidden aria-labelledby="focus-name">
    <div class="widget-bar"><button class="move-widget widget-title" type="button" aria-label="Move inspector with drag or arrow keys"><svg class="icon" aria-hidden="true"><use href="#hud-grip"/></svg></button><h2 id="focus-name"></h2><button class="widget-close" type="button" aria-label="Close inspector"><svg class="icon" aria-hidden="true"><use href="#hud-x"/></svg></button></div>
    <p class="reading" id="reading"></p>
    <progress id="work-progress" max="30" value="0" aria-label="Equipment task progress" hidden></progress>
    <div id="asset-controls" hidden>
      <label>Astronaut <select id="asset-crew"></select></label>
      <button id="assign-asset" type="button"></button>
    </div>
    <p id="focus-detail"></p>
    <button type="button" id="activity" hidden></button>
    <div id="crew-profile" hidden>
      <div id="profile-tabs" role="group" aria-label="Astronaut profile">
        <button type="button" data-profile="duty">Duty</button>
        <button type="button" data-profile="needs">Needs</button>
        <button type="button" data-profile="vitals">Vitals</button>
        <button type="button" data-profile="devices">Devices</button>
      </div>
    </div>
  </section>
  <section class="panel profile-window" id="duty-widget" hidden aria-labelledby="duty-title">
    <div class="widget-bar">
      <button class="move-widget widget-title" type="button" aria-label="Move Duty widget"><svg class="icon" aria-hidden="true"><use href="#hud-grip"/></svg></button>
      <h2 id="duty-title">Duty</h2>
      <button class="widget-close" type="button" aria-label="Close Duty widget"><svg class="icon" aria-hidden="true"><use href="#hud-x"/></svg></button>
    </div>
    <dl class="profile-data" id="duty-data"></dl>
  </section>
  <section class="panel profile-window" id="needs-widget" hidden aria-labelledby="needs-title">
    <div class="widget-bar">
      <button class="move-widget widget-title" type="button" aria-label="Move Needs widget"><svg class="icon" aria-hidden="true"><use href="#hud-grip"/></svg></button>
      <h2 id="needs-title">Needs</h2>
      <button class="widget-close" type="button" aria-label="Close Needs widget"><svg class="icon" aria-hidden="true"><use href="#hud-x"/></svg></button>
    </div>
    <dl class="profile-data" id="needs-data"></dl>
      <div id="wellbeing">
        <label>Private simulated mood <select id="mood">
          <option value="">No report</option><option>Settled</option><option>Focused</option><option>Overloaded</option>
        </select></label>
        <label>Private symptom check-in <select id="symptoms">
          <option value="">No report</option><option>None reported</option><option>Discomfort reported</option>
        </select></label>
      </div>
  </section>
  <section class="panel profile-window" id="vitals-widget" hidden aria-labelledby="vitals-title">
    <div class="widget-bar">
      <button class="move-widget widget-title" type="button" aria-label="Move Vitals widget"><svg class="icon" aria-hidden="true"><use href="#hud-grip"/></svg></button>
      <h2 id="vitals-title">Vitals</h2>
      <button class="widget-close" type="button" aria-label="Close Vitals widget"><svg class="icon" aria-hidden="true"><use href="#hud-x"/></svg></button>
    </div>
    <dl class="profile-data" id="vitals-data"></dl>
      <label id="series-control">Signal <select id="series">
        <option value="heart_rate">Heart rate</option><option value="pitch">Trunk pitch</option>
        <option value="roll">Trunk roll</option><option value="speed">Ship-relative speed</option><option value="emg">Synthetic EMG</option>
      </select></label>
      <canvas width="320" height="100" id="vitals-chart" role="img"></canvas>
  </section>
  <section class="panel profile-window" id="devices-widget" hidden aria-labelledby="devices-title">
    <div class="widget-bar">
      <button class="move-widget widget-title" type="button" aria-label="Move Devices widget"><svg class="icon" aria-hidden="true"><use href="#hud-grip"/></svg></button>
      <h2 id="devices-title">Devices</h2>
      <button class="widget-close" type="button" aria-label="Close Devices widget"><svg class="icon" aria-hidden="true"><use href="#hud-x"/></svg></button>
    </div>
    <dl class="profile-data" id="devices-data"></dl>
  </section>
  <section class="panel" id="crew-widget" hidden aria-labelledby="crew-heading">
    <div class="widget-bar"><button class="move-widget widget-title" type="button" aria-label="Move crew with drag or arrow keys"><svg class="icon" aria-hidden="true"><use href="#hud-grip"/></svg></button><h2 id="crew-heading">Crew on board</h2><button class="widget-close" type="button" aria-label="Close crew"><svg class="icon" aria-hidden="true"><use href="#hud-x"/></svg></button></div>
    <div class="roster" id="roster"></div>
    <p>Simulation replay. Crew duties are scripted and cabin readings use the Python model.</p>
  </section>
</div>
</div>
</section>
</main>

<script>
const element = id => document.getElementById(id);
const data = JSON.parse(element("flight-data").textContent);
const clock = seconds => {
  const whole = Math.floor(seconds);
  const parts = [Math.floor(whole / 3600), Math.floor(whole / 60) % 60, whole % 60];
  return parts.slice(parts[0] ? 0 : 1).map(part => String(part).padStart(2,"0")).join(":");
};
const passageY = 241;
const zones = {
  "cargo-01":        {x:204,y:133,w:211,h:91,side:"upper",door:318,color:"#2e2c48",accent:"#c5a9ff"},
  "engineering-01":  {x:204,y:258,w:211,h:96,side:"lower",door:315,color:"#2b2e49",accent:"#ffa86f"},
  "habitat-01":      {x:415,y:122,w:238,h:102,side:"upper",door:542,color:"#282c50",accent:"#baa5ff"},
  "medical-01":      {x:415,y:258,w:238,h:105,side:"lower",door:550,color:"#233a4e",accent:"#94e8d3"},
  "life-support-01": {x:653,y:136,w:153,h:88,side:"upper",door:736,color:"#243b53",accent:"#84d9ff"},
  "comms-01":        {x:653,y:258,w:153,h:92,side:"lower",door:743,color:"#322d50",accent:"#bbadff"},
  "command-01":      {x:806,y:189,w:124,h:104,side:"bridge",door:passageY,color:"#303b60",accent:"#9ac6ff"},
};
const duties = [
  {role:"Commander", color:"#c9b4ff", stations:[
    ["command-01","Clear the departure checkpoint"],["command-01","Log the life support alert"],
    ["habitat-01","Check crew activity"],["command-01","Review the power report"],
    ["cargo-01","Review the transfer manifest"]]},
  {role:"Medical officer", color:"#a1eddd", stations:[
    ["medical-01","Check the research kit"],["habitat-01","Check in with the crew"],
    ["medical-01","Review the activity checkpoint"],["medical-01","Monitor the crew"],
    ["habitat-01","Follow up with the crew"]]},
  {role:"Systems specialist", color:"#ffcb9c", stations:[
    ["engineering-01","Inspect the power bus"],["life-support-01","Inspect the degraded scrubber"],
    ["life-support-01","Check cabin CO₂"],["engineering-01","Inspect reduced power headroom"],
    ["life-support-01","Review scrubber flow and CO₂"]]},
  {role:"Communications specialist", color:"#a5d2ff", stations:[
    ["comms-01","Check the Ground link"],["comms-01","Prepare the operational snapshot"],
    ["comms-01","Track the first delivery"],["engineering-01","Record the power change"],
    ["comms-01","Review the Ground handoff"]]},
];
duties[1].role = "Research scientist";
duties[1].stations[0] = ["medical-01","Check the research kit"];
const stationDuties = [
  [["command-01","Review approach"],["cargo-01","Authorize transfer after checks"],["comms-01","Coordinate station operations"],["habitat-01","Protected rest"],["command-01","Pilot the return capsule"],["command-01","Close the mission log"]],
  [["medical-01","Prepare the experiment"],["cargo-01","Transfer the research kit"],["medical-01","Collect wrist and trunk motion samples"],["habitat-01","Protected rest"],["medical-01","Secure the research record"],["medical-01","Archive research data"]],
  [["engineering-01","Check approach systems"],["cargo-01","Verify the transfer interface"],["life-support-01","Monitor the station environment"],["habitat-01","Protected rest"],["engineering-01","Check return systems"],["engineering-01","Close the systems log"]],
  [["comms-01","Report approach"],["comms-01","Acknowledge capture"],["comms-01","Track the experiment handoff"],["habitat-01","Use the WC and log hydration"],["comms-01","Report departure"],["comms-01","Confirm recovery"]],
];
function station(duty, member) {
  const order = flightWorkflow.read();
  const time = Math.floor(missionTime);
  const task = activeTask(member, time);
  if (task) {
    const asset = equipment.get(task.asset);
    return [asset.room, asset.task];
  }
  if (member === 2 && order?.assigned && time >= order.decided &&
      (order.completed == null || time < order.completed)) {
    return ["life-support-01", "Inspect life support at the Commander's request"];
  }
  return duty.stations[index] ?? stationDuties[member][index - duty.stations.length];
}

function shape(points, fill, stroke) {
  ctx.beginPath();
  points.forEach(([x,y], i) => i ? ctx.lineTo(x,y) : ctx.moveTo(x,y));
  ctx.closePath();
  ctx.fillStyle = fill;
  ctx.fill();
  ctx.strokeStyle = stroke;
  ctx.stroke();
}

function rectangle(x,y,w,h,fill) {
  ctx.fillStyle = fill;
  ctx.fillRect(x,y,w,h);
}

function bulkhead(x1,y1,x2,y2) {
  ctx.beginPath();
  ctx.moveTo(x1,y1); ctx.lineTo(x2,y2);
  ctx.strokeStyle = "#10162b"; ctx.lineWidth = 7; ctx.stroke();
  ctx.strokeStyle = "#687596"; ctx.lineWidth = 2; ctx.stroke();
  ctx.lineWidth = 1;
}

function doorway(x,y,vertical,accent) {
  ctx.save();
  ctx.translate(x,y);
  if (vertical) ctx.rotate(Math.PI / 2);
  rectangle(-16,-4,32,8,"#3d4764");
  for (const dx of [-19,14]) {
    rectangle(dx,-6,5,12,"#1b2540");
    rectangle(dx,-3,5,6,accent);
  }
  for (const dx of [-10,0,10]) rectangle(dx-2,-1,4,2,"#9cadd480");
  ctx.restore();
}

function drawHistory(series, field, time) {
  const canvas = element("vitals-chart");
  const chart = canvas.getContext("2d");
  const latest = series.filter(row => row.time <= time);
  const values = series.map(row => row[field]);
  const min = Math.min(...values), max = Math.max(...values);
  const lastTime = series[series.length-1].time || 1;
  chart.clearRect(0,0,320,100);
  chart.strokeStyle = "#a9baff";
  chart.fillStyle = "#a9baff";
  chart.beginPath();
  const points = latest.map(row => [12+296*row.time/lastTime,88-76*(row[field]-min)/(max-min || 1)]);
  points.forEach(([x,y],i) => i ? chart.lineTo(x,y) : chart.moveTo(x,y));
  chart.stroke();
  for (const [x,y] of points) {
    chart.beginPath(); chart.arc(x,y,2.5,0,Math.PI*2); chart.fill();
  }
  canvas.setAttribute("aria-label", signals[field][0] + " through " + clock(time) + " · "
    + latest.map(row => clock(row.time) + " " + row[field] + " " + signals[field][1]).join(", "));
}

function renderProfiles(frame) {
  for (const [kind, member] of profileMembers) {
    if (element(kind + "-widget").hidden) continue;
    const id = data.crew[member];
    const row = data.history[id][index];
    const reports = checkIns.get(id + ":" + row.time) ?? {};
    const [zone, task] = station(duties[member], member);

      id + " · " + kind[0].toUpperCase() + kind.slice(1));
    let rows;
    if (kind === "needs") {
      element("mood").value = reports.mood ?? "";
      element("symptoms").value = reports.symptoms ?? "";
      rows = [["Rest",frame.habitat.beds ? "Protected rest window" : "Scheduled"],["Meal and hydration",frame.habitat.meal],["WC",frame.habitat.wc]];
    } else if (kind === "devices") {
      rows = Object.entries(signals).map(([key,[label,unit,source]]) => [
        label + " · " + source, row[key] + " " + unit,
      ]);
    } else if (kind === "vitals") {
      const field = element("series").value;
      drawHistory(data.history[id],field,frame.time);
      rows = [[signals[field][0] + " · " + signals[field][2],row[field] + " " + signals[field][1]],
        ["Observed / received",clock(row.time) + " / " + clock(row.time)],
        ...data.metrics.map(metric => [metric.label,metric.id === "heart_rate"
          ? row.heart_rate + " bpm" : reports[metric.id] || healthSources[metric.id]])];
    } else {
      rows = [["Role",duties[member].role],["Station",roomById.get(zone).name],["Task",task],
        ["Vehicle",frame.vehicle],["Phase",frame.phase],["Experiment",data.research]];

    element(kind + "-data").replaceChildren(...rows.flatMap(([label,value]) => {
      const dt = document.createElement("dt"), dd = document.createElement("dd");
      dt.textContent = label; dd.textContent = value;

}

function setIcon(node, icon, label) {
  const svg = document.createElementNS("http://www.w3.org/2000/svg","svg");
  svg.setAttribute("class","icon");
  svg.setAttribute("aria-hidden","true");
  const use = document.createElementNS("http://www.w3.org/2000/svg","use");
  use.setAttribute("href","#hud-" + icon);
  svg.append(use);
  node.replaceChildren(svg, document.createTextNode(label));
}

function inspect(frame) {
  const name = element("focus-name");
  const value = element("reading");
  const detail = element("focus-detail");
  const action = element("activity");
  action.hidden = selection.crew === undefined;
  element("crew-profile").hidden = action.hidden;
  element("asset-controls").hidden = !selection.asset;
  const progress = element("work-progress");
  progress.hidden = true;
  if (selection.asset) {
    const asset = equipment.get(selection.asset);
    const task = taskAt(asset.id, frame.time);
    const active = task && frame.time < task.finishes;
    progress.hidden = !task;
    if (task) progress.value = Math.min(30, frame.time - task.assigned);
    setIcon(name, asset.icon, asset.name);
    let condition = "Available";
    if (asset.id === "bed") condition = frame.habitat.beds ? "Rest period in progress" : "Needs tidying";
    if (asset.id === "radio") condition = "Local simulated status transmission";
    if (asset.id === "wc") condition = frame.habitat.wc;
    if (asset.id === "scrubber") condition = frame.removal == null ? "Flow unmodeled" : frame.removal + " m³/h";
    if (asset.id === "bus") condition = frame.power == null ? "Headroom unmodeled" : frame.power.toFixed(2) + " kW headroom";
    value.textContent = active ? data.crew[task.member] + " · " + (task.finishes - frame.time) + " s remaining"
      : (task ? task.result + " · " + clock(task.finishes) : condition);
    detail.textContent = asset.use + " · " + (task && !active && asset.id === "bed" ? "Bunk ready" : condition);
    const assign = element("assign-asset");
    assign.textContent = asset.task;
    const crew = Number(element("asset-crew").value);
    const memberBusy = activeTask(crew, frame.time) ||
      (crew === 2 && (flightWorkflow.canComplete(frame)));
    assign.disabled = Boolean(active || memberBusy || frame.habitat.beds && ["bed","wc"].includes(asset.id)
      || frame.time + 30 > endTime);
    return;
  }
  if (selection.crew !== undefined) {
    const id = data.crew[selection.crew];
    const duty = duties[selection.crew];
    const [room, task] = station(duty, selection.crew);
    setIcon(name, "users", id + " · " + duty.role);
    value.textContent = roomById.get(room).name + " · " + task;
    detail.textContent = reduced.has(id)
      ? (frame.time < data.activity_s ? "Reduced activity confirmed for 06:00." : "Reduced activity is contributing to the cabin model.")
      : "Baseline activity. Confirm a reduction to see its effect on cabin CO₂ after 06:00.";
    action.textContent = reduced.has(id) ? "Restore baseline activity" : "Confirm reduced activity";
    return;
  }
  const room = roomById.get(selection.room);
  const readings = {
    "command-01": clock(frame.time) + " · " + frame.phase,
    "habitat-01": "Beds " + frame.habitat.beds + "/4 · WC " + frame.habitat.wc + " · " + frame.habitat.meal,
    "life-support-01": frame.co2.toFixed(2) + " ppm CO₂ · " + (frame.removal == null ? "Scrubber unmodeled" : frame.removal + " m³/h scrubber flow"),
    "engineering-01": frame.power == null ? "Station power unmodeled" : frame.power.toFixed(2) + " kW headroom" + (frame.power < .40 ? " · Low" : ""),
    "medical-01": "Crew check-ins · Scripted",
    "comms-01": frame.time >= data.relay_delivery_s ? "Ground packet delivered · Scripted" : "Awaiting Ground packet · Scripted",
    "cargo-01": frame.dock + " · Scripted",
  };
  setIcon(name, room.room_id === "life-support-01" ? "wind" : "map", room.name);
  value.textContent = readings[room.room_id];
  const occupants = duties.flatMap((duty, i) => station(duty,i)[0] === room.room_id
    ? [data.crew[i] + " · " + station(duty,i)[1]] : []);
  const air = room.room_id === "life-support-01"
    ? " " + frame.air_source + " · O₂ " + frame.air.oxygen_pct.toFixed(1)
      + "% · CO₂ " + frame.air.co2_pct.toFixed(3) + "% · balance gases " + frame.air.balance_pct.toFixed(3) + "%. "
    : " ";
  detail.textContent = room.function + air + (occupants.length ? " On station: " + occupants.join(" / ") : "");
}

function currentFrame() {
  const key = data.crew.filter(id => reduced.has(id)).join(",");
  return {...data.frames[key][index], time:Math.floor(missionTime)};

  element("assign-order").hidden = !flightWorkflow.canDecide(frame);
  element("hold-order").hidden = !flightWorkflow.canDecide(frame);
  element("complete-order").hidden = !flightWorkflow.canComplete(frame);
  element("clock").textContent = clock(frame.time);
  element("phase").textContent = frame.phase + " · " + frame.label;
  element("resource-phase").textContent = frame.phase + " · " + frame.vehicle;
  element("resource-air").textContent = "CO₂ " + frame.co2.toFixed(0) + " ppm";
  element("resource-power").textContent = frame.power == null ? "Power unmodeled" : "Headroom " + frame.power.toFixed(2) + " kW";
  element("resource-crew").textContent = "Crew " + data.crew.length;
  const routePoints = [[18,35],[33,27],[47,23],[62,20],[80,18],[102,16],[130,17],[188,18],[242,35]];
  const [mx,my] = routePoints[frame.route];
  element("ship-position").setAttribute("cx",mx);
  element("ship-position").setAttribute("cy",my);
  element("map-location").textContent = frame.site + " · " + clock(frame.time);
  element("timeline").value = Math.floor(missionTime);
  element("timeline").setAttribute("aria-valuetext", clock(frame.time) + " " + frame.label);
  element("stage").dataset.playing = timer !== null;
  element("play").setAttribute("aria-label", timer !== null ? "Pause" : "Play");
  element("play-icon").setAttribute("href", timer !== null ? "#hud-pause" : "#hud-play");
  element("step").disabled = missionTime >= endTime;
  element("next-event").disabled = missionTime >= endTime;
  element("speed-cycle").textContent = compressed ? "1 h" : speed + "×";
  element("speed-cycle").title = compressed ? "One-hour pacing active. Click for normal speeds."
    : (4 * speed) + " mission seconds per real second. Click to change speed.";
  element("one-hour").setAttribute("aria-pressed", compressed);
  for (const [roomId, button] of roomButtons) {
    button.setAttribute("aria-pressed", selection.room === roomId);
  }
  duties.forEach((duty, i) => {
    const [roomId, task] = station(duty,i);
    const z = zones[roomId];
    const button = pawns.get(i);
    const work = activeTask(i, frame.time);
    const asset = work ? equipment.get(work.asset) : null;
    const floorY = z.side === "upper" ? z.y+z.h-16 : z.side === "lower" ? z.y+z.h-21 : z.y+z.h-24;
    const x = asset ? asset.x : z.x + z.w*(.18+i*.21);
    const y = asset ? floorY : floorY - (i%2)*4;
    routePawn(button,roomId,x,y);
    button.setAttribute("aria-label", data.crew[i] + " " + duty.role + " in " + roomById.get(roomId).name);
    button.title = task;
    button.dataset.working = Boolean(work);
    button.setAttribute("aria-pressed", selection.crew === i);
    roster.get(i).setAttribute("aria-pressed", selection.crew === i);
    const portrait = portraits.get(i);
    portrait.setAttribute("aria-pressed", selection.crew === i);
    portrait.dataset.working = Boolean(work);
    portrait.title = duty.role + " · " + roomById.get(roomId).name + " · " + task;
  });
  for (const [id,button] of equipmentButtons) {
    const task = taskAt(id, frame.time);
    button.dataset.work = task ? (frame.time < task.finishes ? "active" : "complete") : "available";
    button.setAttribute("aria-pressed", selection.asset === id);
  }
  drawShip(frame);
  inspect(frame);
  renderProfiles(frame);
}

const crewPositions = new WeakMap();
function routePawn(button, room, x, y) {
  const previous = crewPositions.get(button);
  if (previous?.x === x && previous?.y === y && previous?.room === room) return;
  place(button,x,y);
  const next = {room,x,y,animation:null};
  crewPositions.set(button,next);
  previous?.animation?.cancel();
  if (!previous || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const portal = id => zones[id].side === "bridge" ? [zones[id].x,passageY] : [zones[id].door,passageY];
  const threshold = id => {
    const z = zones[id];
    return z.side === "bridge" ? portal(id) : [z.door,z.side === "upper" ? z.y+z.h-9 : z.y+9];
  };
  const start = [previous.x,previous.y], end = [x,y];
  const points = previous.room === room ? [start,end]
    : [start,threshold(previous.room),portal(previous.room),portal(room),threshold(room),end];
  const distances = [0];
  for (let i=1;i<points.length;i++) distances.push(distances[i-1]+Math.hypot(
    points[i][0]-points[i-1][0], points[i][1]-points[i-1][1]));
  const distance = distances.at(-1);
  if (!distance) return;
  next.animation = button.animate(points.map(([xx,yy],i)=>({
    left:(xx/11)+"%",top:(yy/475*100)+"%",offset:distances[i]/distance,
  })), {duration:Math.min(1550,Math.max(220,distance*3.3)),easing:"linear"});
}

function stop() {
  cancelAnimationFrame(timer);
  timer = null;
}

function setMissionTime(seconds) {
  missionTime = Math.max(0, Math.min(seconds, endTime));
  index = checkpoints.findLastIndex(frame => frame.time <= missionTime);
}

function tick(now) {
  const rate = compressed ? endTime / 3600 : 4 * speed;
  setMissionTime(missionTime + (now - lastWallTime) / 1000 * rate);
  lastWallTime = now;
  if (missionTime >= endTime) stop();
  else timer = requestAnimationFrame(tick);
  if (Math.floor(missionTime) !== lastRenderedSecond || timer === null) render();
}

for (const room of data.rooms) {
  const z = zones[room.room_id];
  const button = document.createElement("button");
  button.type = "button";
  button.className = "zone";
  button.textContent = room.name;
  placeArea(button,z.x+3,z.y+3,z.w-6,z.h-6);
  button.addEventListener("click", () => { selection = {room:room.room_id}; showInspector(); render(); });
  roomButtons.set(room.room_id,button);
  element("ship").append(button);
}
duties.forEach((duty,i) => {
  const pawn = document.createElement("button");
  pawn.type = "button";
  pawn.className = "pawn";
  pawn.style.setProperty("--suit",duty.color);
  const marker = document.createElement("span");
  marker.textContent = data.crew[i];
  marker.setAttribute("aria-hidden","true");
  pawn.append(marker);
  const member = document.createElement("button");
  member.type = "button";
  member.textContent = duty.role;
  const select = () => { selection = {crew:i}; showInspector(); render(); };
  pawn.addEventListener("click", select);
  member.addEventListener("click", select);
  const portrait = document.createElement("button");
  portrait.type = "button";
  portrait.className = "crew-portrait";
  portrait.style.setProperty("--suit", duty.color);
  portrait.setAttribute("aria-label", "Inspect " + data.crew[i] + " " + duty.role);
  setIcon(portrait, ["users","flask-conical","zap","radio"][i], "");
  const id = document.createElement("small");
  id.textContent = data.crew[i];
  portrait.append(id);
  portrait.addEventListener("click", select);
  portraits.set(i,portrait);
  element("crew-strip").append(portrait);
  pawns.set(i,pawn);
  roster.set(i,member);
  element("ship").append(pawn);
  element("roster").append(member);
});
for (const asset of fixtures) {
  const button = document.createElement("button");
  button.type = "button";
  button.className = "asset-target";
  button.setAttribute("aria-label", asset.name);
  button.title = asset.name;
  setIcon(button, asset.icon, "");
  const [x,y,w,h] = fixtureFootprints[asset.id];
  placeArea(button,x,y,w,h);
  const icon = button.querySelector(".icon");
  icon.style.position = "absolute";
  icon.style.left = (asset.x-x)/w*100 + "%";
  icon.style.top = (asset.y-y)/h*100 + "%";
  icon.style.transform = "translate(-50%,-50%)";
  button.addEventListener("click", () => {
    selection = {asset:asset.id};
    element("asset-crew").value = asset.crew;
    showInspector();
    render();
  });
  equipmentButtons.set(asset.id, button);
  element("ship").append(button);
}
duties.forEach((duty,index) => {
  const option = new Option(data.crew[index] + " · " + duty.role, index);
  element("asset-crew").append(option);
});
element("asset-crew").addEventListener("change", render);
element("assign-asset").addEventListener("click", () => {
  if (!selection.asset || element("assign-asset").disabled) return;
  const asset = equipment.get(selection.asset);
  const assigned = Math.floor(missionTime);
  // Assigning while scrubbed back branches the local task history.
  while (tasks.length && tasks.at(-1).assigned > assigned) tasks.pop();
  tasks.push({
    asset:asset.id, member:Number(element("asset-crew").value),
    assigned, finishes:assigned+30, result:asset.result,
  });
  render();
});
element("timeline").max = endTime;
element("timeline").addEventListener("input", event => {
  stop();
  setMissionTime(Number(event.target.value));
  render();
});
element("play").addEventListener("click", () => {
  if (timer !== null) stop();
  else {
    if (missionTime >= endTime) setMissionTime(0);
    lastWallTime = performance.now();
    timer = requestAnimationFrame(tick);
  }
  render();
});
element("step").addEventListener("click", () => {
  stop();
  setMissionTime(missionTime + 3600);
  render();
});
element("next-event").addEventListener("click", () => {
  stop();
  if (index < last) setMissionTime(checkpoints[index + 1].time);
  render();
});
element("reset").addEventListener("click", () => {
  stop(); setMissionTime(0); speed = 1; compressed = false; reduced.clear(); checkIns.clear(); tasks.length = 0; flightWorkflow.reset(); render();
});
element("activity").addEventListener("click", () => {
  const id = data.crew[selection.crew];
  if (reduced.has(id)) reduced.delete(id);
  else reduced.add(id);
  render();
});
for (const button of document.querySelectorAll("[data-profile]")) {
  button.addEventListener("click", () => {
    const kind = button.dataset.profile;
    activeProfileTrigger = button;
    profileMembers.set(kind, selection.crew);
    profileWindows.get(kind).open();
    render();
  });
}
element("series").addEventListener("change", render);
for (const field of ["mood", "symptoms"]) {
  element(field).addEventListener("change", () => {
    const key = data.crew[profileMembers.get("needs")] + ":" + checkpoints[index].time;
    checkIns.set(key,{...checkIns.get(key),[field]:element(field).value});
    render();
  });
}
element("assign-order").addEventListener("click", () => { flightWorkflow.decide(currentFrame(),true); render(); });
element("hold-order").addEventListener("click", () => { flightWorkflow.decide(currentFrame(),false); render(); });
element("complete-order").addEventListener("click", () => { flightWorkflow.complete(currentFrame()); render(); });
window.addEventListener("storage", event => { if (event.key === flightWorkflow.key) render(); });
const overlay = element("overlays");
const controller = document.querySelector(".flight-controls");
const playArea = document.querySelector(".play-area");
const hudSize = new ResizeObserver(() => {
  const portraitsBottom = element("crew-strip").getBoundingClientRect().bottom;
  const clearance = Math.max(controller.getBoundingClientRect().bottom, portraitsBottom)
    - playArea.getBoundingClientRect().top + 8;
  playArea.style.setProperty("--control-clearance", Math.max(0, clearance) + "px");
});
hudSize.observe(controller);
hudSize.observe(element("crew-strip"));
hudSize.observe(document.querySelector(".hud"));
let widgetOrder = 3;

function enableWidget(panel, toggle, initialPosition) {
  const handle = panel.querySelector(".move-widget");
  const bar = panel.querySelector(".widget-bar");
  let position = initialPosition();
  let pointer = null;
  function move(x, y) {
    position = {
      x: Math.max(0, Math.min(x, overlay.clientWidth - panel.offsetWidth)),
      y: Math.max(0, Math.min(y, overlay.clientHeight - panel.offsetHeight)),
    };
    panel.style.left = position.x + "px";
    panel.style.top = position.y + "px";
  }
  function bringForward() { panel.style.zIndex = ++widgetOrder; }
  panel.addEventListener("pointerdown", bringForward);
  panel.addEventListener("focusin", bringForward);
  bar.addEventListener("pointerdown", event => {
    if (event.button !== 0 || event.target.closest(".widget-close")) return;
    bar.setPointerCapture(event.pointerId);
    pointer = {id:event.pointerId,x:event.clientX-position.x,y:event.clientY-position.y};
  });
  bar.addEventListener("pointermove", event => {
    if (pointer?.id === event.pointerId) move(event.clientX-pointer.x,event.clientY-pointer.y);
  });
  bar.addEventListener("lostpointercapture", () => { pointer = null; });
  handle.addEventListener("keydown", event => {
    const offsets = {ArrowLeft:[-16,0],ArrowRight:[16,0],ArrowUp:[0,-16],ArrowDown:[0,16]};
    if (!offsets[event.key]) return;
    event.preventDefault();
    const [x,y] = offsets[event.key];
    move(position.x+x,position.y+y);
  });
  function setOpen(open) {
    panel.hidden = !open;
    toggle?.setAttribute("aria-pressed", open);
    if (open) { move(position.x,position.y); bringForward(); }
  }
  toggle?.addEventListener("click", () => setOpen(panel.hidden));
  panel.querySelector(".widget-close")?.addEventListener("click", () => {
    setOpen(false);
    const target = toggle ?? activeProfileTrigger;
    if (target && !target.closest("[hidden]")) target.focus();
  });
  const resize = new ResizeObserver(() => {
    if (!panel.hidden) move(position.x, position.y);
  });
  resize.observe(overlay);
  resize.observe(panel);
  if (!panel.hidden) move(position.x,position.y);
  return {open: () => setOpen(true), close: () => setOpen(false)};
}
enableWidget(element("workflow-widget"), element("show-workflow"), () => ({x:14,y:50}));
enableWidget(element("map-widget"), element("show-map"), () => ({x:14,y:overlay.clientHeight - 220}));
enableWidget(element("inspector-widget"), element("show-inspector"), () => ({x:14,y:10}));
enableWidget(element("crew-widget"), element("show-crew"), () => ({
  x:overlay.clientWidth - 354,
  y:overlay.clientWidth < 720 ? 270 : 14,
}));
for (const [offset, kind] of ["duty", "needs", "vitals", "devices"].entries()) {
  profileWindows.set(kind, enableWidget(element(kind + "-widget"), null, () => ({
    x: Math.max(14, overlay.clientWidth - 375 - offset * 28), y: 20 + offset * 48,
  })));
}
render();
</script>
