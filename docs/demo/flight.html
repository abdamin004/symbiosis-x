<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flight · SYMBIOSIS X</title>
<style>
:root{color-scheme:dark;--bg:#060810;--ink:#eef0ff;--muted:#aeb8d3;--blue:#9bdcff;--violet:#bdabff;--edge:#9d9fff33;font:16px/1.45 system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}
main{min-height:100dvh;position:relative}
h1,h2,p{margin:0}a{color:var(--blue);text-underline-offset:.2em}
.stage{position:relative;isolation:isolate;min-height:100dvh;background:radial-gradient(ellipse at 64% 45%,#251944 0%,#0a0e20 53%,#05070f 82%);overflow:clip}
.stage::before,.stage::after{content:"";position:absolute;pointer-events:none;z-index:-1}
.stage::before{inset:-70px;background-image:radial-gradient(circle,#e5e2ffb8 1px,transparent 1.5px),radial-gradient(circle,#b9d7fba8 .8px,transparent 1.2px);background-size:97px 83px,149px 127px;background-position:11px 21px,63px 55px;opacity:.7}
.stage[data-playing=true]::before{animation:travel 9s linear infinite}
.stage::after{width:min(65vw,640px);aspect-ratio:1;border-radius:50%;right:-16%;top:48%;background:radial-gradient(circle at 25% 8%,#595989 0,#303451 23%,#111427 54%,#080a16 72%);box-shadow:-7px -10px 45px #736aff35;opacity:.7}
@keyframes travel{to{transform:translateX(-97px)}}
.viewport{overflow-x:auto;overscroll-behavior-x:contain;position:relative;margin:0 auto;max-width:1500px;padding-top:clamp(1rem,7vh,5rem)}
.ship{width:100%;min-width:680px;aspect-ratio:1100/475;position:relative;isolation:isolate}
#hull{position:absolute;width:100%;height:100%;inset:0;pointer-events:none;z-index:-1}
button{font:inherit;color:inherit;cursor:pointer;background:#171d38;border:0;border-radius:8px;padding:.4rem .7rem}
button:hover{background:#292852}button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
button:disabled{opacity:.46;cursor:default}
button[aria-pressed=true]{background:#3d315e}
.zone,.pawn{position:absolute;transform:translate(-50%,-50%)}
.zone{background:transparent;text-shadow:0 1px 8px #070711;font-size:clamp(.68rem,1.15vw,.88rem);padding:.12rem .38rem;white-space:nowrap;color:#e1e6ff}
.zone[data-alert=true]{color:#ffd198;text-shadow:0 0 12px #ffa45f}
.pawn{--suit:#a9c7ff;width:38px;height:38px;padding:0;display:grid;place-items:center;border:1px solid color-mix(in srgb,var(--suit),transparent 45%);border-radius:50%;background:#141a31;transition:left .95s ease,top .95s ease;z-index:2}
.pawn::before{content:"";width:21px;height:19px;border-radius:7px 7px 4px 4px;background:linear-gradient(90deg,transparent 3px,var(--suit) 3px 18px,transparent 18px);box-shadow:inset 0 -4px #121a2d9e;transform:translateY(3px)}
.pawn::after{content:"";position:absolute;width:14px;height:11px;top:6px;border:2px solid var(--suit);border-radius:50%;background:#1c2848}
.pawn[aria-pressed=true]{outline:2px solid var(--suit);outline-offset:3px}
.pawn span{position:absolute;top:100%;font:600 .62rem ui-monospace,monospace;color:#fff;background:#111629;padding:.13rem .25rem;border-radius:3px;white-space:nowrap}
.control-deck{position:relative;display:flex;align-items:center;flex-wrap:wrap;gap:.5rem;padding:.65rem 1rem;background:#070b17e8}
.control-deck input{flex:1;min-width:8rem;accent-color:var(--violet)}
#play{background:#bcafff;color:#15102a;font-weight:700}#play:hover{background:#dbd2ff}
.clock{font:700 .9rem ui-monospace,monospace;color:var(--blue)}
.overlays{position:absolute;inset:0;pointer-events:none}
.panel{position:absolute;width:min(340px,calc(100% - 20px));max-height:min(60vh,520px);overflow:auto;pointer-events:auto;background:#090e22e8;border-radius:12px;padding:.8rem 1rem;box-shadow:0 12px 38px #0007}
.panel h2{font-size:1.08rem}.panel p{color:var(--muted);margin:.35rem 0;font-size:.9rem}.panel .reading{color:var(--blue);font-weight:650}
.widget-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:.4rem}
.move-widget{cursor:grab;touch-action:none;background:transparent;color:var(--muted);padding:.15rem .35rem;font-size:.8rem}
.move-widget:active{cursor:grabbing}
.roster{display:flex;flex-wrap:wrap;gap:.45rem;margin:.65rem 0}
.roster button{font-size:.8rem}
.ribbon{position:relative;z-index:100;display:flex;gap:.6rem 1.25rem;align-items:center;flex-wrap:wrap;padding:.65rem 1rem;background:#070b18e8;font-size:.82rem}
.ribbon output{color:var(--blue)}
.flight-controls{position:absolute;top:3.4rem;right:.65rem;z-index:100;width:min(410px,calc(100% - 1.3rem))}
.viewport{padding-top:clamp(10rem,24vh,14rem)}
#map-widget{width:280px}.route-map{width:100%;display:block}.route-map circle{fill:#b0bdfa}.route-map #ship-position{fill:#e8ccff;stroke:#fbf4ff}
@media(max-width:720px){.flight-controls{top:5.5rem}.viewport{padding-top:15rem}}
.control-deck a{margin-left:auto;font-size:.85rem}
#phase{flex:1 0 100%;color:var(--muted);font-size:.86rem}
#timeline{flex:1 1 9rem}
#profile-tabs{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:.65rem}
#profile-tabs button{font-size:.76rem}
.profile-data{margin:.55rem 0;display:grid;grid-template-columns:1fr auto;gap:.24rem .6rem;font-size:.82rem;color:var(--muted)}
.profile-data dd{margin:0;color:var(--ink);text-align:right}
#vitals-chart{width:100%;height:auto;background:#10182d;border-radius:5px}
#wellbeing label{display:block;font-size:.8rem;color:var(--muted);margin-top:.3rem}
#wellbeing select{max-width:100%}
[hidden]{display:none!important}
@media(max-width:720px){.stage::after{width:70vw}.control-deck input{flex-basis:100%}}
@media(prefers-reduced-motion:reduce){.pawn{transition:none}.stage[data-playing=true]::before{animation:none}}
</style>
</head>
<body>
<main>
<section class="stage" id="stage" aria-label="Spacecraft in flight">
  <div class="ribbon" aria-label="Mission resources">
    <output id="resource-phase"></output><output id="resource-air"></output><output id="resource-power"></output><output id="resource-crew"></output>
    <button type="button" id="show-inspector" aria-pressed="false">Inspector</button>
    <button type="button" id="show-crew" aria-pressed="false">Crew</button>
    <button type="button" id="show-map" aria-pressed="true">Route map</button>
    <a href="/mission">Mission control</a>
  </div>
  <div class="viewport" tabindex="0" aria-label="Scrollable spacecraft cutaway">
    <div class="ship" id="ship">
      <canvas id="hull" width="1100" height="475" aria-hidden="true"></canvas>
    </div>
  </div>
  <div class="flight-controls"><div class="control-deck">
    <p id="phase"></p>
    <button id="play" type="button">Fly mission</button>
    <button id="step" type="button">Step</button>
    <button id="reset" type="button">Reset</button>
    <label>Speed <select id="speed"><option value="1">1×</option><option value="2">2×</option><option value="4">4×</option></select></label>
    <input id="timeline" type="range" min="0" value="0" aria-label="Mission checkpoint">
    <output class="clock" id="clock" for="timeline"></output>
  </div></div>
<div class="overlays" id="overlays">
  <section class="panel" id="map-widget" aria-label="Route minimap">
    <div class="widget-bar"><button class="move-widget" type="button" aria-label="Move route map with drag or arrow keys">⠿ Move</button></div>
    <svg class="route-map" viewBox="0 0 260 58" aria-hidden="true">
      <path d="M18 35 Q75 -4 130 17 Q190 -4 242 35" stroke="#8385bd" fill="none"/>
      <circle cx="18" cy="35" r="4"/><circle cx="130" cy="17" r="4"/><circle cx="242" cy="35" r="4"/>
      <circle id="ship-position" cx="18" cy="35" r="5"/>
      <g fill="#bac5e7" font-size="10"><text x="3" y="55">Earth</text><text x="122" y="39">ISS</text><text x="218" y="55">Return</text></g>
    </svg>
    <p id="map-location"></p>
  </section>
  <section class="panel" id="inspector-widget" hidden aria-labelledby="focus-name">
    <div class="widget-bar"><button class="move-widget" type="button" aria-label="Move inspector with drag or arrow keys">⠿ Move</button></div>
    <h2 id="focus-name"></h2>
    <p class="reading" id="reading"></p>
    <p id="focus-detail"></p>
    <button type="button" id="activity" hidden></button>
    <div id="crew-profile" hidden>
      <div id="profile-tabs" role="group" aria-label="Astronaut profile">
        <button type="button" data-profile="duty">Duty</button>
        <button type="button" data-profile="needs">Needs</button>
        <button type="button" data-profile="vitals">Vitals</button>
        <button type="button" data-profile="devices">Devices</button>
      </div>
      <dl class="profile-data" id="profile-data"></dl>
      <label id="series-control" hidden>Signal <select id="series">
        <option value="heart_rate">Heart rate</option><option value="pitch">Trunk pitch</option>
        <option value="roll">Trunk roll</option><option value="speed">Ship-relative speed</option><option value="emg">Synthetic EMG</option>
      </select></label>
      <canvas width="320" height="100" id="vitals-chart" role="img" hidden></canvas>
      <div id="wellbeing" hidden>
        <label>Private simulated mood <select id="mood">
          <option value="">No report</option><option>Settled</option><option>Focused</option><option>Overloaded</option>
        </select></label>
        <label>Private symptom check-in <select id="symptoms">
          <option value="">No report</option><option>None reported</option><option>Discomfort reported</option>
        </select></label>
      </div>
    </div>
  </section>
  <section class="panel" id="crew-widget" hidden aria-labelledby="crew-heading">
    <div class="widget-bar"><button class="move-widget" type="button" aria-label="Move crew with drag or arrow keys">⠿ Move</button></div>
    <h2 id="crew-heading">Crew on board</h2>
    <div class="roster" id="roster"></div>
    <p>Simulation replay. Crew duties are scripted and cabin readings use the Python model.</p>
  </section>
</div>
</section>
</main>
<script type="application/json" id="flight-data">__FLIGHT_DATA__</script>
<script>
const element = id => document.getElementById(id);
const data = JSON.parse(element("flight-data").textContent);
const clock = seconds => [Math.floor(seconds / 60), seconds % 60]
  .map(part => String(part).padStart(2, "0")).join(":");
const zones = {
  "cargo-01": {x:162,y:194,w:126,h:89,color:"#252841"},
  "engineering-01": {x:302,y:187,w:145,h:96,color:"#292443"},
  "habitat-01": {x:458,y:130,w:181,h:98,color:"#222d4c"},
  "medical-01": {x:458,y:257,w:181,h:93,color:"#263753"},
  "life-support-01": {x:650,y:130,w:133,h:98,color:"#253954"},
  "comms-01": {x:650,y:257,w:133,h:93,color:"#30294e"},
  "command-01": {x:795,y:187,w:143,h:96,color:"#30395e"},
};
const duties = [
  {role:"Commander", color:"#c9b4ff", stations:[
    ["command-01","Clear the departure checkpoint"],["command-01","Log the life support alert"],
    ["habitat-01","Check crew activity"],["command-01","Review the power report"],
    ["cargo-01","Review the transfer manifest"]]},
  {role:"Medical officer", color:"#a1eddd", stations:[
    ["medical-01","Check the research kit"],["habitat-01","Check in with the crew"],
    ["medical-01","Review the activity checkpoint"],["medical-01","Monitor the crew"],
    ["habitat-01","Follow up with the crew"]]},
  {role:"Systems specialist", color:"#ffcb9c", stations:[
    ["engineering-01","Inspect the power bus"],["life-support-01","Inspect the degraded scrubber"],
    ["life-support-01","Check cabin CO₂"],["engineering-01","Inspect reduced power headroom"],
    ["life-support-01","Review scrubber flow and CO₂"]]},
  {role:"Communications specialist", color:"#a5d2ff", stations:[
    ["comms-01","Check the Ground link"],["comms-01","Prepare the operational snapshot"],
    ["comms-01","Track the first delivery"],["engineering-01","Record the power change"],
    ["comms-01","Review the Ground handoff"]]},
];
duties[1].role = "Research scientist";
duties[1].stations[0] = ["medical-01","Check the research kit"];
const stationDuties = [
  [["command-01","Review approach"],["cargo-01","Authorize transfer after checks"],["comms-01","Coordinate station operations"],["habitat-01","Protected rest"],["command-01","Pilot the return capsule"],["command-01","Close the mission log"]],
  [["medical-01","Prepare the experiment"],["cargo-01","Transfer the research kit"],["medical-01","Collect wrist and trunk motion samples"],["habitat-01","Protected rest"],["medical-01","Secure the research record"],["medical-01","Archive research data"]],
  [["engineering-01","Check approach systems"],["cargo-01","Verify the transfer interface"],["life-support-01","Monitor the station environment"],["habitat-01","Protected rest"],["engineering-01","Check return systems"],["engineering-01","Close the systems log"]],
  [["comms-01","Report approach"],["comms-01","Acknowledge capture"],["comms-01","Track the experiment handoff"],["habitat-01","Use the WC and log hydration"],["comms-01","Report departure"],["comms-01","Confirm recovery"]],
];
function station(duty, member) {
  return duty.stations[index] ?? stationDuties[member][index - duty.stations.length];
}

const roomById = new Map(data.rooms.map(room => [room.room_id, room]));
const reduced = new Set();
const roomButtons = new Map();
const pawns = new Map();
const roster = new Map();
const ctx = element("hull").getContext("2d");
const last = data.frames[""].length - 1;
let index = 0;
let timer = null;
let selection = {room:"command-01"};

function place(button, x, y) {
  button.style.left = x / 11 + "%";
  button.style.top = y / 4.75 + "%";
}

function shape(points, fill, stroke) {
  ctx.beginPath();
  points.forEach(([x,y], i) => i ? ctx.lineTo(x,y) : ctx.moveTo(x,y));
  ctx.closePath();
  ctx.fillStyle = fill;
  ctx.fill();
  ctx.strokeStyle = stroke;
  ctx.stroke();
}

function rectangle(x,y,w,h,fill) {
  ctx.fillStyle = fill;
  ctx.fillRect(x,y,w,h);
}

function drawShip(frame) {
  ctx.clearRect(0,0,1100,475);
  ctx.lineWidth = 2;
  const plume = ctx.createLinearGradient(5,0,180,0);
  plume.addColorStop(0,"#7b70ff00");
  plume.addColorStop(1,"#a1c5ffe8");
  shape([[13,235],[140,211],[163,213],[163,261],[140,263]],plume,"#7777ff39");
  for (const y of [44,382]) {
    rectangle(540,y,14,49,"#50557f");
    rectangle(352,y,395,44,"#171f45");
    for (let x=360;x<745;x+=23) rectangle(x,y+5,19,34,"#283668");
  }
  shape([[116,230],[167,166],[416,166],[448,110],[779,110],[811,165],[938,165],
    [1005,235],[938,306],[810,306],[782,366],[449,366],[416,305],[166,305],[116,260]],
    "#171b34","#8c9dd2a0");
  rectangle(177,228,754,16,"#424c71");
  rectangle(533,139,20,199,"#38486b");
  rectangle(708,139,20,199,"#38486b");
  for (const [id, z] of Object.entries(zones)) {
    const warning = (id === "life-support-01" && frame.removal != null && frame.removal < 20)
      || (id === "engineering-01" && frame.power != null && frame.power < .40);
    const glow = ctx.createRadialGradient(z.x+z.w/2,z.y+z.h/2,4,z.x+z.w/2,z.y+z.h/2,z.w*.7);
    glow.addColorStop(0,warning ? "#98615180" : z.color);
    glow.addColorStop(1,"#171b3400");
    rectangle(z.x-8,z.y-8,z.w+16,z.h+16,glow);
    rectangle(z.x+12,z.y+10,24,3,warning ? "#ffc486" : "#9bbffc");
    for (let x=z.x+16;x<z.x+z.w-17;x+=19) rectangle(x,z.y+z.h-12,13,3,"#8093ca70");
    drawFixtures(id, z, frame);
    roomButtons.get(id).dataset.alert = warning;
  }
}

function drawFixtures(id, z, frame) {
  const x = z.x + 12, y = z.y + 29;
  const steel = "#92a2cc9c", dark = "#101a34", light = "#a8bfff";
  if (id === "habitat-01") {
    for (let bed = 0; bed < 4; bed += 1) {
      rectangle(x+bed*24,y,19,29,bed < frame.habitat.beds ? "#7c75ad" : steel);
      rectangle(x+2+bed*24,y+2,15,6,light);
    }
    rectangle(x+110,y,20,27,dark);
    ctx.beginPath(); ctx.ellipse(x+120,y+15,7,9,0,0,Math.PI*2);
    ctx.fillStyle = frame.habitat.wc === "In use" ? "#b4a3e6" : steel; ctx.fill();
    rectangle(x+137,y+5,20,13,steel);
  } else if (id === "engineering-01" || id === "life-support-01") {
    for (let rack = 0; rack < 3; rack += 1) {
      rectangle(x+rack*23,y,17,26,dark);
      rectangle(x+3+rack*23,y+6,11,2,id === "engineering-01" && frame.power < .4 ? "#ffbd80" : light);
      rectangle(x+3+rack*23,y+14,11,2,steel);
    }
  } else if (id === "cargo-01") {
    for (let crate = 0; crate < 3; crate += 1) {
      rectangle(x+crate*22,y+3,16,16,steel);
      rectangle(x+crate*22+6,y+3,3,16,dark);
    }
  } else {
    rectangle(x,y,53,17,steel);
    rectangle(x+4,y+3,45,8,dark);
    rectangle(x+9,y+5,20,2,light);
    if (id === "medical-01") {
      rectangle(x+69,y,18,31,steel);
      rectangle(x+72,y+3,12,8,light);
    }
  }
}

function showInspector() {
  if (element("inspector-widget").hidden) element("show-inspector").click();
}

let profileTab = "duty";
const checkIns = new Map();
const signals = {
  heart_rate:["Heart rate","bpm","Simulated optical watch"],
  pitch:["Trunk pitch","°","Simulated back-pod IMU"],
  roll:["Trunk roll","°","Simulated back-pod IMU"],
  speed:["Ship-relative speed","m/s","Synthetic motion"],
  emg:["EMG RMS","mV","Unvalidated synthetic back-pod channel"],
};
const healthSources = {
  heart_rate:"Simulated watch", blood_pressure:"Cuff · no sample",
  glucose:"Dedicated meter · no sample", temperature:"Thermometer · no sample",
  sleep:"Rest schedule available", mood:"Crew report", symptoms:"Crew report",
};

function drawHistory(series, field, time) {
  const canvas = element("vitals-chart");
  const chart = canvas.getContext("2d");
  const latest = series.filter(row => row.time <= time);
  const values = series.map(row => row[field]);
  const min = Math.min(...values), max = Math.max(...values);
  const lastTime = series[series.length-1].time || 1;
  chart.clearRect(0,0,320,100);
  chart.strokeStyle = "#a9baff";
  chart.fillStyle = "#a9baff";
  chart.beginPath();
  const points = latest.map(row => [12+296*row.time/lastTime,88-76*(row[field]-min)/(max-min || 1)]);
  points.forEach(([x,y],i) => i ? chart.lineTo(x,y) : chart.moveTo(x,y));
  chart.stroke();
  for (const [x,y] of points) {
    chart.beginPath(); chart.arc(x,y,2.5,0,Math.PI*2); chart.fill();
  }
  canvas.setAttribute("aria-label", signals[field][0] + " through " + clock(time) + " · "
    + latest.map(row => clock(row.time) + " " + row[field] + " " + signals[field][1]).join(", "));
}

function renderProfile(id, frame) {
  const row = data.history[id][index];
  const entryKey = id + ":" + frame.time;
  const reports = checkIns.get(entryKey) ?? {};
  const reporting = profileTab === "needs";
  element("wellbeing").hidden = !reporting;
  element("mood").value = reports.mood ?? "";
  element("symptoms").value = reports.symptoms ?? "";
  element("series-control").hidden = profileTab !== "vitals";
  element("vitals-chart").hidden = profileTab !== "vitals";
  document.querySelectorAll("[data-profile]").forEach(button => {
    button.setAttribute("aria-pressed", button.dataset.profile === profileTab);
  });
  let rows;
  if (profileTab === "needs") {
    rows = [["Rest",frame.habitat.beds ? "Protected rest window" : "Next on station"],["Meal and hydration",frame.habitat.meal],["WC",frame.habitat.wc],["Wellbeing reports","Private · current checkpoint"]];
  } else if (profileTab === "devices") {
    rows = Object.entries(signals).map(([key,[label,unit,source]]) => [
      label + " · " + source, row[key] + " " + unit,
    ]);
  } else if (profileTab === "vitals") {
    const field = element("series").value;
    drawHistory(data.history[id],field,frame.time);
    rows = [[signals[field][0] + " · " + signals[field][2],row[field] + " " + signals[field][1]],
      ["Observed / received",clock(row.time) + " / " + clock(row.time)],
      ...data.metrics.map(metric => [metric.label,metric.id === "heart_rate"
        ? row.heart_rate + " bpm" : reports[metric.id] || healthSources[metric.id]])];
  } else {
    rows = [["Vehicle",frame.vehicle],["Phase",frame.phase],["Experiment",data.research]];
  }
  element("profile-data").replaceChildren(...rows.flatMap(([label,value]) => {
    const dt = document.createElement("dt"), dd = document.createElement("dd");
    dt.textContent = label; dd.textContent = value;
    return [dt,dd];
  }));
}

function inspect(frame) {
  const name = element("focus-name");
  const value = element("reading");
  const detail = element("focus-detail");
  const action = element("activity");
  action.hidden = selection.crew === undefined;
  element("crew-profile").hidden = action.hidden;
  if (selection.crew !== undefined) {
    const id = data.crew[selection.crew];
    const duty = duties[selection.crew];
    const [room, task] = station(duty, selection.crew);
    name.textContent = id + " · " + duty.role;
    value.textContent = roomById.get(room).name + " · " + task;
    detail.textContent = reduced.has(id)
      ? (frame.time < data.activity_s ? "Reduced activity confirmed for 06:00." : "Reduced activity is contributing to the cabin model.")
      : "Baseline activity. Confirm a reduction to see its effect on cabin CO₂ after 06:00.";
    action.textContent = reduced.has(id) ? "Restore baseline activity" : "Confirm reduced activity";
    renderProfile(id, frame);
    return;
  }
  const room = roomById.get(selection.room);
  const readings = {
    "command-01": clock(frame.time) + " · " + frame.phase,
    "habitat-01": "Beds " + frame.habitat.beds + "/4 · WC " + frame.habitat.wc + " · " + frame.habitat.meal,
    "life-support-01": frame.co2.toFixed(2) + " ppm CO₂ · " + (frame.removal == null ? "Scrubber unmodeled" : frame.removal + " m³/h scrubber flow"),
    "engineering-01": frame.power == null ? "Station power unmodeled" : frame.power.toFixed(2) + " kW headroom" + (frame.power < .40 ? " · Low" : ""),
    "medical-01": "Crew check-ins · Scripted",
    "comms-01": frame.time >= data.relay_delivery_s ? "Ground packet delivered · Scripted" : "Awaiting Ground packet · Scripted",
    "cargo-01": frame.dock + " · Scripted",
  };
  name.textContent = room.name;
  value.textContent = readings[room.room_id];
  const occupants = duties.flatMap((duty, i) => station(duty,i)[0] === room.room_id
    ? [data.crew[i] + " · " + station(duty,i)[1]] : []);
  const air = room.room_id === "life-support-01"
    ? " " + frame.air_source + " · O₂ " + frame.air.oxygen_pct.toFixed(1)
      + "% · CO₂ " + frame.air.co2_pct.toFixed(3) + "% · balance gases " + frame.air.balance_pct.toFixed(3) + "%. "
    : " ";
  detail.textContent = room.function + air + (occupants.length ? " On station: " + occupants.join(" / ") : "");
}

function render() {
  const key = data.crew.filter(id => reduced.has(id)).join(",");
  const frame = data.frames[key][index];
  element("clock").textContent = clock(frame.time);
  element("phase").textContent = frame.phase + " · " + frame.label;
  element("resource-phase").textContent = frame.phase + " · " + frame.vehicle;
  element("resource-air").textContent = "CO₂ " + frame.co2.toFixed(0) + " ppm";
  element("resource-power").textContent = frame.power == null ? "Power unmodeled" : "Headroom " + frame.power.toFixed(2) + " kW";
  element("resource-crew").textContent = "Crew " + data.crew.length;
  const routePoints = [[18,35],[33,27],[47,23],[62,20],[80,18],[102,16],[130,17],[188,18],[242,35]];
  const [mx,my] = routePoints[frame.route];
  element("ship-position").setAttribute("cx",mx);
  element("ship-position").setAttribute("cy",my);
  element("map-location").textContent = frame.site + " · " + clock(frame.time);
  element("timeline").value = index;
  element("timeline").setAttribute("aria-valuetext", clock(frame.time) + " " + frame.label);
  element("stage").dataset.playing = timer !== null;
  element("play").textContent = timer ? "Pause flight" : (index === last ? "Replay flight" : "Fly mission");
  element("step").disabled = index === last;
  for (const [roomId, button] of roomButtons) {
    button.setAttribute("aria-pressed", selection.room === roomId);
  }
  duties.forEach((duty, i) => {
    const [roomId, task] = station(duty,i);
    const z = zones[roomId];
    const button = pawns.get(i);
    place(button,z.x+z.w*(.18 + i*.21),z.y+z.h*.68);
    button.setAttribute("aria-label", data.crew[i] + " " + duty.role + " in " + roomById.get(roomId).name);
    button.title = task;
    button.setAttribute("aria-pressed", selection.crew === i);
    roster.get(i).setAttribute("aria-pressed", selection.crew === i);
  });
  drawShip(frame);
  inspect(frame);
}

function stop() {
  clearInterval(timer);
  timer = null;
}

function advance() {
  if (index < last) index += 1;
  if (index === last) stop();
  render();
}

for (const room of data.rooms) {
  const z = zones[room.room_id];
  const button = document.createElement("button");
  button.type = "button";
  button.className = "zone";
  button.textContent = room.name;
  place(button,z.x+z.w/2,z.y+z.h*.27);
  button.addEventListener("click", () => { selection = {room:room.room_id}; showInspector(); render(); });
  roomButtons.set(room.room_id,button);
  element("ship").append(button);
}
duties.forEach((duty,i) => {
  const pawn = document.createElement("button");
  pawn.type = "button";
  pawn.className = "pawn";
  pawn.style.setProperty("--suit",duty.color);
  const marker = document.createElement("span");
  marker.textContent = data.crew[i];
  marker.setAttribute("aria-hidden","true");
  pawn.append(marker);
  const member = document.createElement("button");
  member.type = "button";
  member.textContent = duty.role;
  const select = () => { selection = {crew:i}; showInspector(); render(); };
  pawn.addEventListener("click", select);
  member.addEventListener("click", select);
  pawns.set(i,pawn);
  roster.set(i,member);
  element("ship").append(pawn);
  element("roster").append(member);
});
element("timeline").max = last;
element("timeline").addEventListener("input", event => {
  stop();
  index = Number(event.target.value);
  render();
});
element("play").addEventListener("click", () => {
  if (timer !== null) stop();
  else {
    if (index === last) index = 0;
    timer = setInterval(advance,2400 / Number(element("speed").value));
  }
  render();
});
element("speed").addEventListener("change", () => {
  if (timer === null) return;
  stop();
  timer = setInterval(advance,2400 / Number(element("speed").value));
});
element("step").addEventListener("click", () => { stop(); advance(); });
element("reset").addEventListener("click", () => { stop(); index = 0; reduced.clear(); checkIns.clear(); render(); });
element("activity").addEventListener("click", () => {
  const id = data.crew[selection.crew];
  if (reduced.has(id)) reduced.delete(id);
  else reduced.add(id);
  render();
});
for (const button of document.querySelectorAll("[data-profile]")) {
  button.addEventListener("click", () => { profileTab = button.dataset.profile; render(); });
}
element("series").addEventListener("change", render);
for (const field of ["mood", "symptoms"]) {
  element(field).addEventListener("change", () => {
    const key = data.crew[selection.crew] + ":" + data.frames[""][index].time;
    checkIns.set(key,{...checkIns.get(key),[field]:element(field).value});
    render();
  });
}
const overlay = element("overlays");
let widgetOrder = 3;

function enableWidget(panel, toggle, initialPosition) {
  const handle = panel.querySelector(".move-widget");
  let position = initialPosition();
  let pointer = null;
  function move(x, y) {
    position = {
      x: Math.max(0, Math.min(x, overlay.clientWidth - panel.offsetWidth)),
      y: Math.max(0, Math.min(y, overlay.clientHeight - panel.offsetHeight)),
    };
    panel.style.left = position.x + "px";
    panel.style.top = position.y + "px";
  }
  function bringForward() { panel.style.zIndex = ++widgetOrder; }
  panel.addEventListener("pointerdown", bringForward);
  panel.addEventListener("focusin", bringForward);
  handle.addEventListener("pointerdown", event => {
    if (event.button !== 0) return;
    handle.setPointerCapture(event.pointerId);
    pointer = {id:event.pointerId,x:event.clientX-position.x,y:event.clientY-position.y};
  });
  handle.addEventListener("pointermove", event => {
    if (pointer?.id === event.pointerId) move(event.clientX-pointer.x,event.clientY-pointer.y);
  });
  handle.addEventListener("lostpointercapture", () => { pointer = null; });
  handle.addEventListener("keydown", event => {
    const offsets = {ArrowLeft:[-16,0],ArrowRight:[16,0],ArrowUp:[0,-16],ArrowDown:[0,16]};
    if (!offsets[event.key]) return;
    event.preventDefault();
    const [x,y] = offsets[event.key];
    move(position.x+x,position.y+y);
  });
  toggle.addEventListener("click", () => {
    panel.hidden = !panel.hidden;
    toggle.setAttribute("aria-pressed", !panel.hidden);
    if (!panel.hidden) { move(position.x,position.y); bringForward(); }
  });
  window.addEventListener("resize", () => move(position.x,position.y));
  move(position.x,position.y);
}
enableWidget(element("map-widget"), element("show-map"), () => ({x:14,y:overlay.clientHeight - 165}));
enableWidget(element("inspector-widget"), element("show-inspector"), () => ({x:14,y:80}));
enableWidget(element("crew-widget"), element("show-crew"), () => ({
  x:overlay.clientWidth - element("crew-widget").offsetWidth - 14,
  y:overlay.clientWidth < 720 ? 450 : 14,
}));
render();
</script>
</body>
